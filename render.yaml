# Portal público de Spasso Gym (SOLO el portal; Recepción se queda en la PC del gimnasio).
# La base de datos vive en Neon (gratis, permanente). Aquí NO se crea base de datos.
services:
  - type: web
    name: spasso-portal
    runtime: python
    plan: free
    rootDir: proyecto_gym
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_cloud:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL        # cadena de conexión de Neon (la pegas tú en Render)
        sync: false
      - key: SYNC_SECRET         # el MISMO valor que pondrás en el .env de Recepción
        sync: false
      - key: SECRET_KEY          # lo genera Render solo
        generateValue: true
      - key: FORWARDED_ALLOW_IPS # para ver la IP real de cada visitante
        value: "*"
      - key: DB_POOL_MAX         # pocas conexiones: la base gratis de Neon es pequeña
        value: "5"
      - key: APP_TIMEZONE
        value: America/La_Paz
      - key: TZ
        value: America/La_Paz
