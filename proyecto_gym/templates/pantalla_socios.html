<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenida — Spasso Gym</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      --gradiente-fondo: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #2563eb 100%);
    }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      background: var(--gradiente-fondo);
      transition: background 0.5s ease;
    }
    .pantalla {
      width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* ===== ESTADO EN REPOSO: logo/nombre del gimnasio ===== */
    #estadoReposo {
      display: flex; flex-direction: column; align-items: center; gap: 25px;
      color: white; text-align: center;
      animation: fadeIn 0.6s ease;
    }
    #estadoReposo .icono { font-size: 110px; opacity: 0.95; }
    #estadoReposo .icono img { max-height: 130px; max-width: 260px; object-fit: contain; }
    #estadoReposo h1 { font-size: 52px; font-weight: 800; letter-spacing: 1px; }
    #estadoReposo p { font-size: 20px; opacity: 0.8; }
    #relojReposo { font-size: 26px; opacity: 0.85; margin-top: 10px; font-variant-numeric: tabular-nums; }

    /* ===== ESTADO DESACTIVADO ===== */
    #estadoDesactivado {
      display: none; color: white; text-align: center; max-width: 600px; padding: 40px;
    }
    #estadoDesactivado i { font-size: 60px; margin-bottom: 20px; opacity: 0.7; }
    #estadoDesactivado h2 { font-size: 28px; margin-bottom: 15px; }
    #estadoDesactivado p { font-size: 16px; opacity: 0.8; line-height: 1.6; }

    /* ===== ESTADO EVENTO: bienvenida/despedida ===== */
    #estadoEvento {
      display: none; flex-direction: column; align-items: center; gap: 18px;
      color: white; text-align: center; padding: 40px; max-width: 90%;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #estadoEvento .icono-evento { font-size: 90px; }
    #estadoEvento .icono-evento.entrada { color: #4ade80; }
    #estadoEvento .icono-evento.salida { color: #fbbf24; }
    #estadoEvento h1 { font-size: 46px; font-weight: 800; }
    #estadoEvento .nombre { font-size: 38px; font-weight: 700; }
    #estadoEvento .detalles {
      display: flex; gap: 40px; margin-top: 15px; flex-wrap: wrap; justify-content: center;
    }
    #estadoEvento .detalle-item {
      background: rgba(255,255,255,0.15); border-radius: 16px; padding: 18px 28px; min-width: 160px;
    }
    #estadoEvento .detalle-item .etiqueta { font-size: 14px; opacity: 0.75; margin-bottom: 6px; }
    #estadoEvento .detalle-item .valor { font-size: 26px; font-weight: 700; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div class="pantalla">

    <div id="estadoDesactivado">
      <i class="fas fa-tv"></i>
      <h2>Pantalla de bienvenida desactivada</h2>
      <p>Actívala desde Configuración → "Habilitar pantalla de bienvenida para socios" en el panel de recepción.</p>
    </div>

    <div id="estadoReposo">
      <div class="icono"><i class="fas fa-dumbbell"></i></div>
      <h1 id="nombreGimReposo">Spasso Gym</h1>
      <p>Coloque su dedo en el lector de huellas para registrar su ingreso</p>
      <div id="relojReposo"></div>
    </div>

    <div id="estadoEvento">
      <div class="icono-evento" id="iconoEvento"><i class="fas fa-check-circle"></i></div>
      <h1 id="tituloEvento">¡Bienvenido!</h1>
      <div class="nombre" id="nombreEvento">—</div>
      <div class="detalles" id="detallesEvento"></div>
    </div>

  </div>

  <script>
    const BROADCAST_KEY = 'spasso_evento_huella';
    let configuracion = { pantalla_bienvenida_habilitada: false, duracion_pantalla_bienvenida: 4 };
    let timerVolverReposo = null;

    const TEMAS_COLOR = {
      azul:    'linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #2563eb 100%)',
      oscuro:  'linear-gradient(135deg, #111827 0%, #1f2937 50%, #374151 100%)',
      morado:  'linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #8b5cf6 100%)',
      verde:   'linear-gradient(135deg, #065f46 0%, #059669 50%, #10b981 100%)',
      rojo:    'linear-gradient(135deg, #7f1d1d 0%, #b91c1c 50%, #ef4444 100%)',
      naranja: 'linear-gradient(135deg, #7c2d12 0%, #c2410c 50%, #f97316 100%)'
    };

    function aplicarTema(nombreTema) {
      const gradiente = TEMAS_COLOR[nombreTema] || TEMAS_COLOR.azul;
      document.documentElement.style.setProperty('--gradiente-fondo', gradiente);
    }

    function aplicarLogo(logoUrl) {
      const contenedorIcono = document.querySelector('#estadoReposo .icono');
      if (!contenedorIcono) return;
      if (logoUrl) {
        contenedorIcono.innerHTML = `<img src="${logoUrl}" alt="Logo del gimnasio">`;
      } else {
        contenedorIcono.innerHTML = '<i class="fas fa-dumbbell"></i>';
      }
    }

    function actualizarReloj() {
      const el = document.getElementById('relojReposo');
      if (el) el.textContent = new Date().toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    async function cargarConfiguracion() {
      try {
        const resp = await fetch('/api/gym/config');
        if (!resp.ok) throw new Error('No se pudo cargar la configuración');
        configuracion = await resp.json();
        document.getElementById('nombreGimReposo').textContent = configuracion.nombre_gimnasio || 'Spasso Gym';
        aplicarTema(configuracion.pantalla_bienvenida_tema);
        aplicarLogo(configuracion.pantalla_bienvenida_logo_url);
        mostrarEstadoBase();
      } catch (error) {
        console.error('Error al cargar configuración:', error);
      }
    }

    function mostrarEstadoBase() {
      document.getElementById('estadoEvento').style.display = 'none';
      if (configuracion.pantalla_bienvenida_habilitada) {
        document.getElementById('estadoDesactivado').style.display = 'none';
        document.getElementById('estadoReposo').style.display = 'flex';
      } else {
        document.getElementById('estadoReposo').style.display = 'none';
        document.getElementById('estadoDesactivado').style.display = 'block';
      }
    }

    function mostrarEvento(datos) {
      if (!configuracion.pantalla_bienvenida_habilitada) return;
      if (timerVolverReposo) clearTimeout(timerVolverReposo);

      document.getElementById('estadoReposo').style.display = 'none';
      document.getElementById('estadoDesactivado').style.display = 'none';
      const eventoDiv = document.getElementById('estadoEvento');
      const icono = document.getElementById('iconoEvento');
      const titulo = document.getElementById('tituloEvento');
      const nombre = document.getElementById('nombreEvento');
      const detalles = document.getElementById('detallesEvento');

      const esSalida = datos.tipo === 'salida';
      icono.className = 'icono-evento ' + (esSalida ? 'salida' : 'entrada');
      icono.innerHTML = esSalida ? '<i class="fas fa-hand-peace"></i>' : '<i class="fas fa-check-circle"></i>';
      titulo.textContent = esSalida ? '¡Hasta luego!' : '¡Bienvenido!';
      nombre.textContent = datos.nombre || '';

      const items = [];
      if (!esSalida && datos.membresia && datos.membresia.dias_restantes !== null && datos.membresia.dias_restantes !== undefined) {
        items.push({ etiqueta: 'Plan', valor: datos.membresia.plan || '—' });
        const dias = datos.membresia.dias_restantes;
        items.push({ etiqueta: 'Días restantes', valor: dias >= 0 ? `${dias} días` : 'Vencido' });
      }
      if (datos.numero_locker) {
        items.push({ etiqueta: 'Casillero', valor: `#${datos.numero_locker}` });
      }
      detalles.innerHTML = items.map(i => `
        <div class="detalle-item">
          <div class="etiqueta">${i.etiqueta}</div>
          <div class="valor">${i.valor}</div>
        </div>
      `).join('');

      eventoDiv.style.display = 'flex';

      const duracionMs = (configuracion.duracion_pantalla_bienvenida || 4) * 1000;
      timerVolverReposo = setTimeout(mostrarEstadoBase, duracionMs);
    }

    // Recibe eventos en tiempo real desde recepcion.html (misma sesión de
    // navegador, aunque esté en otra pestaña/ventana/monitor).
    if ('BroadcastChannel' in window) {
      const canal = new BroadcastChannel('spasso-huella');
      canal.onmessage = (event) => mostrarEvento(event.data);
    }

    // Respaldo por si BroadcastChannel no está disponible: localStorage
    // dispara el evento 'storage' en las OTRAS pestañas cuando cambia.
    window.addEventListener('storage', (event) => {
      if (event.key === BROADCAST_KEY && event.newValue) {
        try { mostrarEvento(JSON.parse(event.newValue)); } catch (e) { /* noop */ }
      }
    });

    cargarConfiguracion();
    // Refresca la configuración cada 30s por si se cambia habilitar/duración
    // mientras esta pantalla ya está abierta en el segundo monitor.
    setInterval(cargarConfiguracion, 30000);
  </script>
</body>
</html>
