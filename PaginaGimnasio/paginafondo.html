<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End of Line</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: 'Arial', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            animation: bgAnimation 10s linear infinite;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #000000, #ffffff, #000000);
            background-size: 400% 400%;
            animation: gradientMove 5s ease infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes bgAnimation {
            0% {
                background: linear-gradient(45deg, #000000, #ffffff, #000000);
                background-size: 400% 400%;
            }
            50% {
                background: linear-gradient(45deg, #ffffff, #000000, #ffffff);
                background-size: 400% 400%;
            }
            100% {
                background: linear-gradient(45deg, #000000, #ffffff, #000000);
                background-size: 400% 400%;
            }
        }

        audio {
            display: none;
        }

        .logo {
            font-size: 6rem;
            font-weight: bold;
            letter-spacing: 10px;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- musica -->
    <audio id="audio" loop autoplay>
        <source src="music/End of Line (From TRON_ LegacyScore).mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <div class="background"></div>
    <div class="logo">VYLOE</div>

    <script>
        // reproduccion automatica de musica
        document.getElementById('audio').play();
    </script>
</body>
</html>
